name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {} # boleh jalankan manual dari tab Actions

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /opt/planet-ai-app

            echo "→ git pull"
            git pull origin main

            echo "→ tulis env runtime (.env.production.local) — secret dari GitHub Secrets"
            {
              echo "OO_WEBHOOK_SECRET=${{ secrets.OO_WEBHOOK_SECRET }}"
              echo "PB_SERVICE_EMAIL=webhook@planetsoft.id"
              echo "PB_SERVICE_PASSWORD=${{ secrets.PB_SERVICE_PASSWORD }}"
              echo "NEXT_PUBLIC_PB_URL=https://db.planet-ai.tech"
              echo "SMTP_HOST=smtp-relay.brevo.com"
              echo "SMTP_PORT=587"
              echo "SMTP_USER=ad749d001@smtp-brevo.com"
              echo "SMTP_PASS=${{ secrets.SMTP_PASS }}"
              echo "SMTP_FROM=PlanetPrompt <member@planetsoft.id>"
              echo "APP_LOGIN_URL=https://planetsoft.id/app"
            } > .env.production.local

            echo "→ npm ci"
            npm ci --no-audit --no-fund

            echo "→ npm run build"
            npm run build

            echo "→ bersihin cache gambar Next (biar gambar yang di-swap langsung tampil)"
            rm -rf .next/cache/images

            echo "→ pm2 restart"
            pm2 restart planet-ai-app --update-env

            echo "→ verify health"
            sleep 3
            curl -fsSI http://localhost:3001 || (echo "App tidak respon!" && exit 1)

            echo "✅ Deploy success"
