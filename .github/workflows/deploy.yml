name: Deploy to VPS

on:
  # Deploy MANUAL saja. Jalankan dari tab Actions → "Deploy to VPS" → "Run workflow"
  # (branch main), atau `gh workflow run "Deploy to VPS"`.
  # Push/merge ke main TIDAK auto-deploy — biar bisa batch & kontrol timing
  # (hindari SSH timeout beruntun). CI tetap auto di push/PR (workflow terpisah).
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 120s
          command_timeout: 15m
          script_stop: true
          script: |
            set -e
            cd /opt/planet-ai-app

            echo "→ git pull"
            git pull origin main

            echo "→ tulis env runtime (.env.production.local) — secret dari GitHub Secrets"
            {
              echo "OO_WEBHOOK_SECRET=${{ secrets.OO_WEBHOOK_SECRET }}"
              echo "MAYAR_WEBHOOK_SECRET=${{ secrets.MAYAR_WEBHOOK_SECRET }}"
              echo "PB_SERVICE_EMAIL=webhook@planetsoft.id"
              echo "PB_SERVICE_PASSWORD=${{ secrets.PB_SERVICE_PASSWORD }}"
              echo "NEXT_PUBLIC_PB_URL=https://db.planet-ai.tech"
              echo "SMTP_HOST=smtp-relay.brevo.com"
              echo "SMTP_PORT=587"
              echo "SMTP_USER=ad749d001@smtp-brevo.com"
              echo "SMTP_PASS=${{ secrets.SMTP_PASS }}"
              echo "SMTP_FROM=PlanetPrompt <member@planetsoft.id>"
              echo "APP_LOGIN_URL=https://planetsoft.id/app"
            } > .env.production.local

            echo "→ npm ci"
            npm ci --no-audit --no-fund

            echo "→ npm run build"
            npm run build

            echo "→ bersihin cache gambar Next (biar gambar yang di-swap langsung tampil)"
            rm -rf .next/cache/images

            echo "→ pm2 restart"
            pm2 restart planet-ai-app --update-env

            echo "→ verify health"
            sleep 3
            curl -fsSI http://localhost:3001 || (echo "App tidak respon!" && exit 1)

            echo "→ pre-warm cache gambar (optimasi /_next/image di-trigger SEKARANG, bukan pas pengunjung pertama)"
            for PAGE in /planetprompt /; do
              curl -s "http://localhost:3001$PAGE" \
                | grep -oE '/_next/image\?url=[^" ,]+' \
                | sed 's/&amp;/\&/g' \
                | sort -u | head -300 \
                | xargs -r -P 4 -I{} curl -s -o /dev/null "http://localhost:3001{}"
            done || true
            echo "✓ pre-warm cache selesai"

            echo "✅ Deploy success"

      - name: Purge Cloudflare cache
        if: success()
        run: |
          if [ -n "${{ secrets.CF_ZONE_ID }}" ] && [ -n "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "→ purge Cloudflare cache (biar gambar yang di-swap langsung update)"
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
            echo ""
          else
            echo "→ skip purge: CF_ZONE_ID / CF_API_TOKEN belum di-set di GitHub Secrets"
          fi
